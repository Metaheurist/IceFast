# IceFast - CI/CD
# PR / push: unit tests + secret scan + npm audit + production build
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: "1 · Unit tests"
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  security-audit:
    name: "1 · Secret scan & dependency check"
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Restore Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v5
        with:
          path: gitleaks
          key: gitleaks-8.28.0-${{ runner.os }}-x64

      - name: Download Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz
          chmod +x gitleaks

      - name: Gitleaks (secret scan)
        run: ./gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1 --redact

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  build:
    name: "2 · Production build"
    needs: [unit-tests, security-audit]
    if: |
      always() &&
      needs.unit-tests.result == 'success' &&
      needs.security-audit.result == 'success' &&
      (
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[skip ci]')
      )
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
